name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Check public repository and release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh repo view --json visibility --jq .visibility)" = PUBLIC
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== "v" + version) throw new Error("Release tag must match package.json version");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package

  build:
    needs: verify
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: bun-linux-x64-baseline
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: bun-linux-arm64
          - platform: darwin-x64
            runner: macos-15-intel
            target: bun-darwin-x64-baseline
          - platform: darwin-arm64
            runner: macos-15
            target: bun-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Compile standalone binary
        env:
          BUN_TARGET: ${{ matrix.target }}
        run: pnpm build:binary "$BUN_TARGET"
      - run: pnpm test:binary
      - run: pnpm test:installer
      - name: Archive binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          tar -czf "release/s1s-mcp-$PLATFORM.tar.gz" -C .s1s/bin s1s-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - name: Prepare release assets
        run: |
          cp scripts/install.sh release/install.sh
          cd release
          sha256sum -- *.tar.gz install.sh > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes "${prerelease[@]}"
