minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect staged secrets
        entry: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: Audit GitHub Actions security
        entry: mise exec -- zizmor --offline --no-progress
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
